name: Conformance

on:
  push:
    branches: [main, v4.5]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    branches: [main, v4.5]

jobs:
  plugin-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # eve is not published to PyPI yet — clone the repo for its conformance
      # harness, schema, AND the core `scripts/package-plugin` dispatcher that
      # every package manifest `exec` resolves to at the eve checkout root.
      # Once eve ships, replace this step with `pip install eve`.
      - uses: actions/checkout@v5
        with:
          repository: fruwehq/eve
          ref: ${{ (github.base_ref == 'v4.5' || github.head_ref == 'v4.5' || github.ref_name == 'v4.5') && 'v4.5' || 'main' }}
          path: eve

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install ./eve

      - name: Validate manifest environment contracts
        run: python tests/test-manifest-env-contract

      - name: Run plugin-test against every package
        run: |
          set -e
          git ls-files '*eve-plugin.yaml' | while IFS= read -r manifest; do
            echo "::group::plugin-test $manifest"
            eve/scripts/plugin-test "$manifest"
            echo "::endgroup::"
          done
